[project]
name = "vaani"
version = "0.0.1"
description = "Vaani — one phone number, one AI voice agent for restaurant and doctor bookings in Telugu, Hindi and Indian English"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Runtime deps are added phase by phase (Phase 1: data + DB, Phase 2: API, Phase 4: Pipecat).
dependencies = [
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = [
    "db: needs Postgres (VAANI_TEST_DB_URL or local initdb/pg_ctl); skipped otherwise",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Long SQL strings in DB tests read better on one line.
"backend/tests/*" = ["E501"]
